name: Deploy a VPS OVH

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar SSH
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_deploy ~/.ssh/known_hosts
          if ! grep -q "PRIVATE KEY-----" ~/.ssh/id_deploy; then
            echo "::error::VPS_SSH_KEY no contiene una clave PRIVADA (debe empezar por -----BEGIN ... PRIVATE KEY-----)"
            exit 1
          fi
          ssh-keygen -y -f ~/.ssh/id_deploy > /dev/null || { echo "::error::La clave privada no es válida o tiene contraseña"; exit 1; }

      # Aborta si VPS_PATH no es la carpeta real de la web (debe tener docker-compose.yml y los certificados).
      - name: Comprobar carpeta destino
        env:
          HOST: ${{ secrets.VPS_HOST }}
          USER: ${{ secrets.VPS_USER }}
          PORT: ${{ secrets.VPS_PORT || '22' }}
          TARGET: ${{ secrets.VPS_PATH }}
        run: |
          HOST=$(echo "$HOST" | tr -d '[:space:]'); USER=$(echo "$USER" | tr -d '[:space:]'); TARGET=$(echo "$TARGET" | tr -d '[:space:]')
          ssh -i ~/.ssh/id_deploy -p "$PORT" "$USER@$HOST" "test -f '$TARGET/docker-compose.yml' && test -d '$TARGET/certbot/conf/live'" \
            || { echo "::error::VPS_PATH no apunta a la carpeta de la web (falta docker-compose.yml o certbot/conf/live)"; exit 1; }

      # Copia el repo al VPS. certbot/ (certificados) y .git no se tocan.
      - name: Subir archivos
        env:
          HOST: ${{ secrets.VPS_HOST }}
          USER: ${{ secrets.VPS_USER }}
          PORT: ${{ secrets.VPS_PORT || '22' }}
          TARGET: ${{ secrets.VPS_PATH }}
        run: |
          HOST=$(echo "$HOST" | tr -d '[:space:]'); USER=$(echo "$USER" | tr -d '[:space:]'); TARGET=$(echo "$TARGET" | tr -d '[:space:]')
          rsync -avz --delete \
            --exclude='.git/' --exclude='.github/' --exclude='certbot/' --exclude='.DS_Store' \
            -e "ssh -i ~/.ssh/id_deploy -p $PORT" \
            ./ "$USER@$HOST:$TARGET/"

      # La web va dentro de la imagen (COPY), así que hay que reconstruirla.
      - name: Reconstruir y reiniciar contenedores
        env:
          HOST: ${{ secrets.VPS_HOST }}
          USER: ${{ secrets.VPS_USER }}
          PORT: ${{ secrets.VPS_PORT || '22' }}
          TARGET: ${{ secrets.VPS_PATH }}
        run: |
          HOST=$(echo "$HOST" | tr -d '[:space:]'); USER=$(echo "$USER" | tr -d '[:space:]'); TARGET=$(echo "$TARGET" | tr -d '[:space:]')
          ssh -i ~/.ssh/id_deploy -p "$PORT" "$USER@$HOST" "
            set -e
            cd '$TARGET'
            docker compose up -d --build web nginx
            docker compose exec -T nginx nginx -s reload
            docker image prune -f
          "
