<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" font-family="Manrope, -apple-system, 'Segoe UI', sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#131417"/>
      <stop offset="1" stop-color="#25262c"/>
    </linearGradient>
    <linearGradient id="area" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffb648" stop-opacity=".35"/>
      <stop offset="1" stop-color="#ffb648" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="400" height="200" fill="url(#bg)"/>

  <!-- dashboard window -->
  <rect x="28" y="22" width="344" height="168" rx="10" fill="#1e1f24" stroke="#2c2d34"/>
  <circle cx="44" cy="36" r="3.5" fill="#3a3b42"/>
  <circle cx="56" cy="36" r="3.5" fill="#3a3b42"/>
  <circle cx="68" cy="36" r="3.5" fill="#3a3b42"/>
  <text x="200" y="40" text-anchor="middle" font-size="10" fill="#7d7e85">sitesonar.es</text>
  <line x1="28" y1="50" x2="372" y2="50" stroke="#2c2d34"/>

  <!-- stat tiles -->
  <rect x="42" y="62" width="96" height="44" rx="7" fill="#25262c"/>
  <text x="52" y="78" font-size="9" fill="#7d7e85">Uptime 30d</text>
  <text x="52" y="97" font-size="17" font-weight="700" fill="#e6e6e6">99.98%</text>

  <rect x="152" y="62" width="96" height="44" rx="7" fill="#25262c"/>
  <text x="162" y="78" font-size="9" fill="#7d7e85">Certificado TLS</text>
  <text x="162" y="97" font-size="17" font-weight="700" fill="#ffb648">82 días</text>

  <rect x="262" y="62" width="96" height="44" rx="7" fill="#25262c"/>
  <text x="272" y="78" font-size="9" fill="#7d7e85">Latencia</text>
  <text x="272" y="97" font-size="17" font-weight="700" fill="#e6e6e6">184 ms</text>

  <!-- latency chart -->
  <path d="M42 160 L72 150 L102 154 L132 140 L162 146 L192 128 L222 136 L252 122 L282 130 L312 116 L358 120 L358 176 L42 176 Z" fill="url(#area)"/>
  <path d="M42 160 L72 150 L102 154 L132 140 L162 146 L192 128 L222 136 L252 122 L282 130 L312 116 L358 120" fill="none" stroke="#ffb648" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
  <circle cx="312" cy="116" r="3.5" fill="#ffb648"/>
  <line x1="42" y1="176" x2="358" y2="176" stroke="#2c2d34"/>
</svg>
