<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" font-family="Manrope, -apple-system, 'Segoe UI', sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#131417"/>
      <stop offset="1" stop-color="#25262c"/>
    </linearGradient>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#7d7e85"/>
    </marker>
  </defs>
  <rect width="400" height="200" fill="url(#bg)"/>

  <!-- alert -->
  <rect x="18" y="74" width="74" height="52" rx="9" fill="#1e1f24" stroke="#2c2d34"/>
  <path d="M55 86 L65 104 L45 104 Z" fill="none" stroke="#ffb648" stroke-width="2" stroke-linejoin="round"/>
  <line x1="55" y1="92" x2="55" y2="97" stroke="#ffb648" stroke-width="2" stroke-linecap="round"/>
  <text x="55" y="118" text-anchor="middle" font-size="9" fill="#b0b1b6">Alerta</text>

  <!-- agent -->
  <rect x="116" y="74" width="74" height="52" rx="9" fill="#1e1f24" stroke="#2c2d34"/>
  <rect x="140" y="85" width="26" height="18" rx="5" fill="none" stroke="#e6e6e6" stroke-width="1.8"/>
  <circle cx="148" cy="94" r="2" fill="#e6e6e6"/>
  <circle cx="158" cy="94" r="2" fill="#e6e6e6"/>
  <line x1="153" y1="80" x2="153" y2="85" stroke="#e6e6e6" stroke-width="1.8"/>
  <text x="153" y="118" text-anchor="middle" font-size="9" fill="#b0b1b6">Agente LLM</text>

  <!-- OPA gate -->
  <rect x="214" y="68" width="74" height="64" rx="9" fill="#2a2418" stroke="#ffb648"/>
  <path d="M251 80 L265 85 L265 95 C265 104 251 110 251 110 C251 110 237 104 237 95 L237 85 Z" fill="none" stroke="#ffb648" stroke-width="2" stroke-linejoin="round"/>
  <path d="M245 95 L249 99 L257 90" fill="none" stroke="#ffb648" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="251" y="124" text-anchor="middle" font-size="9" font-weight="700" fill="#ffb648">Política OPA</text>

  <!-- kubernetes -->
  <rect x="312" y="74" width="74" height="52" rx="9" fill="#1e1f24" stroke="#2c2d34"/>
  <g transform="translate(349 95)" stroke="#e6e6e6" stroke-width="1.8" fill="none">
    <circle r="11"/>
    <circle r="3"/>
    <line x1="0" y1="-3" x2="0" y2="-11"/>
    <line x1="2.6" y1="1.5" x2="9.5" y2="5.5"/>
    <line x1="-2.6" y1="1.5" x2="-9.5" y2="5.5"/>
  </g>
  <text x="349" y="118" text-anchor="middle" font-size="9" fill="#b0b1b6">Kubernetes</text>

  <!-- arrows -->
  <line x1="94" y1="100" x2="112" y2="100" stroke="#7d7e85" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="192" y1="100" x2="210" y2="100" stroke="#7d7e85" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="290" y1="100" x2="308" y2="100" stroke="#7d7e85" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- denied branch -->
  <path d="M251 134 L251 160" stroke="#7d7e85" stroke-width="1.5" stroke-dasharray="3 3"/>
  <rect x="211" y="160" width="80" height="22" rx="11" fill="#2b1d1f" stroke="#5a3237"/>
  <text x="251" y="175" text-anchor="middle" font-size="9" fill="#e0868f">acción bloqueada</text>

  <!-- verify loop -->
  <path d="M349 72 C349 36 153 36 153 72" fill="none" stroke="#7d7e85" stroke-width="1.5" stroke-dasharray="3 3" marker-end="url(#arr)"/>
  <text x="251" y="34" text-anchor="middle" font-size="9" fill="#7d7e85">verificación</text>
</svg>
