server {
    listen 80;
    server_name marcosperez.es www.marcosperez.es;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}


server {
    listen 443 ssl;
    server_name marcosperez.es www.marcosperez.es;

    ssl_certificate /etc/letsencrypt/live/marcosperez.es/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/marcosperez.es/privkey.pem;

    location / {
        proxy_pass http://web:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
