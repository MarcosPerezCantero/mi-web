<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" font-family="Manrope, -apple-system, 'Segoe UI', sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#131417"/>
      <stop offset="1" stop-color="#25262c"/>
    </linearGradient>
  </defs>
  <rect width="400" height="200" fill="url(#bg)"/>

  <!-- connectors -->
  <g stroke="#7d7e85" stroke-width="1.5" fill="none">
    <path d="M200 60 L200 84"/>
    <path d="M200 120 L200 130 L110 130 L110 142"/>
    <path d="M200 130 L290 130 L290 142"/>
  </g>

  <!-- root CA -->
  <rect x="130" y="18" width="140" height="42" rx="9" fill="#2a2418" stroke="#ffb648"/>
  <g transform="translate(152 39)" fill="none" stroke="#ffb648" stroke-width="1.8">
    <circle r="7"/>
    <path d="M-4 6 L-5 14 L0 11 L5 14 L4 6"/>
  </g>
  <text x="170" y="35" font-size="11" font-weight="700" fill="#e6e6e6">Root CA</text>
  <text x="170" y="50" font-size="9" fill="#ffb648">ML-DSA-87</text>

  <!-- intermediate -->
  <rect x="130" y="84" width="140" height="36" rx="9" fill="#1e1f24" stroke="#2c2d34"/>
  <text x="200" y="99" text-anchor="middle" font-size="10" font-weight="700" fill="#e6e6e6">CA intermedia</text>
  <text x="200" y="112" text-anchor="middle" font-size="9" fill="#b0b1b6">SLH-DSA-SHA2-128s</text>

  <!-- leaves -->
  <rect x="50" y="142" width="120" height="36" rx="9" fill="#1e1f24" stroke="#2c2d34"/>
  <text x="110" y="157" text-anchor="middle" font-size="10" font-weight="700" fill="#e6e6e6">Servidor TLS</text>
  <text x="110" y="170" text-anchor="middle" font-size="9" fill="#b0b1b6">ML-DSA-65</text>

  <rect x="230" y="142" width="120" height="36" rx="9" fill="#1e1f24" stroke="#2c2d34"/>
  <text x="290" y="157" text-anchor="middle" font-size="10" font-weight="700" fill="#e6e6e6">Cifrado</text>
  <text x="290" y="170" text-anchor="middle" font-size="9" fill="#b0b1b6">ML-KEM-768</text>

  <!-- side badges -->
  <text x="22" y="34" font-size="9" fill="#7d7e85">FIPS 203</text>
  <text x="22" y="48" font-size="9" fill="#7d7e85">FIPS 204</text>
  <text x="22" y="62" font-size="9" fill="#7d7e85">FIPS 205</text>
  <text x="378" y="34" text-anchor="end" font-size="9" fill="#7d7e85">OpenSSL 3.5</text>
  <text x="378" y="48" text-anchor="end" font-size="9" fill="#7d7e85">X.509</text>
</svg>
