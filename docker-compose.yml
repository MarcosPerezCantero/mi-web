services:
  web:
    build: .
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    restart: unless-stopped
    depends_on:
      - web
    # default: llega a "web" (marcosperez.es).
    # sitesonar_proxy: red del proyecto SiteSonar (~/site_sonar), para llegar a
    # sitesonar-web y sitesonar-panel (ver nginx/conf.d/sitesonar.conf y panel.conf).
    networks:
      - default
      - sitesonar_proxy

  certbot:
    image: certbot/certbot
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot

networks:
  # La crea "docker compose up" en ~/site_sonar; aquí solo nos unimos a ella.
  sitesonar_proxy:
    external: true
