# Bloque de sitesonar.es para el nginx compartido del VPS (proyecto "mi-web",
# que ya sirve marcosperez.es — ver docker-compose.yml de este proyecto).
#
# Instalación (en el VPS, no aquí):
#   cp ~/site_sonar/deploy/sitesonar.nginx.conf ~/mi-web/nginx/conf.d/sitesonar.conf
#   (una copia, no un enlace — el contenedor de nginx solo ve lo que hay
#   dentro de ~/mi-web/nginx/conf.d, no el resto del sistema de archivos del
#   VPS, así que un symlink hacia fuera de esa carpeta no funciona)
#
# "sitesonar-web" es el alias de red que nuestro docker-compose.yml le pone al
# contenedor "web" al unirse a sitesonar_proxy — la red propia de SiteSonar a
# la que este nginx también se conecta (ver docker-compose.yml de mi-web).

server {
    listen 80;
    listen [::]:80;
    server_name sitesonar.es www.sitesonar.es;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name sitesonar.es www.sitesonar.es;

    ssl_certificate     /etc/letsencrypt/live/sitesonar.es/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sitesonar.es/privkey.pem;

    # Cabeceras de seguridad básicas.
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # HSTS: el navegador recuerda durante un año que este dominio va solo por
    # HTTPS. Sin includeSubDomains a propósito: no comprometer subdominios
    # que quizá algún día no tengan certificado.
    add_header Strict-Transport-Security "max-age=31536000" always;

    client_max_body_size 1m;  # esta app no recibe uploads, no hace falta más

    location / {
        proxy_pass http://sitesonar-web:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
