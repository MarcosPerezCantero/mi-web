# Bloque de panel.marcosperez.es para el nginx compartido del VPS (mi-web).
# Instalación (en el VPS): cp ~/site_sonar/ops/panel/panel.nginx.conf ~/mi-web/nginx/conf.d/panel.conf
#
# Pasa las peticiones al contenedor "panel" (alias sitesonar-panel en la red
# sitesonar_proxy, ver docker-compose.yml), que pide usuario y contraseña.

server {
    listen 80;
    listen [::]:80;
    server_name panel.marcosperez.es;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name panel.marcosperez.es;

    ssl_certificate     /etc/letsencrypt/live/panel.marcosperez.es/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/panel.marcosperez.es/privkey.pem;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;

    location / {
        proxy_pass http://sitesonar-panel:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
